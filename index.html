<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AXEIS IDE</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="unsupported" class="unsupported" hidden>
      <div class="unsupported-card">
        <h1>AXEIS IDE</h1>
        <p>This IDE requires Chromium (Chrome or Edge). Firefox and Safari are not supported.</p>
        <p class="unsupported-why">
          Talking to the robot over USB uses the Web Serial API, which only Chromium-based
          browsers implement.
        </p>
      </div>
    </div>

    <div id="app" class="app">
      <header class="topbar">
        <span class="brand">AXEIS IDE</span>
        <span id="status" class="status" data-state="disconnected">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text" class="status-text">Disconnected</span>
        </span>
        <button id="connect" type="button" class="btn btn-primary">Connect</button>
      </header>

      <main class="panes">
        <section class="pane pane-editor">
          <div class="tabbar">
            <div class="tabs" role="tablist" aria-label="Editor mode">
              <button id="tab-blocks" type="button" class="tab" role="tab" aria-selected="true" aria-controls="blocks">
                Blocks
              </button>
              <button id="tab-python" type="button" class="tab" role="tab" aria-selected="false" aria-controls="editor">
                Python
              </button>
            </div>
            <span class="toolbar-gap"></span>
            <button id="to-python" type="button" class="tab-action" title="Copy the Python these blocks make into the Python tab">
              Open as Python
            </button>
          </div>
          <div id="blocks" class="blocks-host" role="tabpanel" aria-labelledby="tab-blocks"></div>
          <div id="editor" class="editor-host" role="tabpanel" aria-labelledby="tab-python" hidden></div>
        </section>
        <section id="console-pane" class="pane pane-console" data-open="false">
          <button id="console-toggle" type="button" class="console-head" aria-expanded="false" aria-controls="console-body">
            <span class="console-title">Console</span>
            <span id="console-unread" class="console-unread" hidden>new output</span>
            <svg class="console-chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div id="console-body" class="console-body" hidden>
            <div id="console-notice" class="console-notice" role="status" hidden></div>
            <div id="console" class="console-log" tabindex="0"></div>
          </div>
        </section>
      </main>

      <footer class="toolbar">
        <button id="run" type="button" class="btn btn-run" disabled>Run</button>
        <button id="stop" type="button" class="btn btn-stop" disabled>Stop</button>
        <button id="download" type="button" class="btn">Download</button>
        <button id="upload" type="button" class="btn">Upload</button>
        <span class="toolbar-gap"></span>
        <button id="clear" type="button" class="btn">Clear</button>
      </footer>
    </div>

    <input id="file-input" type="file" accept=".py,.json,text/x-python,application/json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
