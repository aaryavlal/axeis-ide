<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="96px" height="124px">
  <style type="text/css">
#background {
  fill: none;
}
.arrows {
  fill: #000;
  stroke: none;
}
.selected>.arrows {
  fill: #fff;
}
.checkmark {
  fill: #000;
  font-family: sans-serif;
  font-size: 10pt;
  text-anchor: middle;
}
.trash, .icon {
  fill: none;
  stroke: #c9d1d9;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.trash > path:nth-child(2) {
  stroke-width: 2.5;
}
.button {
  fill: #161b22;
  stroke: #30363d;
  stroke-width: 1;
}
.dot {
  fill: #c9d1d9;
}
  </style>
  <rect id="background" width="96" height="124" x="0" y="0" />

  <g>
    <path class="arrows" d="M 13,1.5 13,14.5 1.74,8 z" />
    <path class="arrows" d="M 17.5,3 30.5,3 24,14.26 z" />
    <path class="arrows" d="M 35,1.5 35,14.5 46.26,8 z" />
  </g>
  <g class="selected" transform="translate(0, 16)">
    <path class="arrows" d="M 13,1.5 13,14.5 1.74,8 z" />
    <path class="arrows" d="M 17.5,3 30.5,3 24,14.26 z" />
    <path class="arrows" d="M 35,1.5 35,14.5 46.26,8 z" />
  </g>

  <text class="checkmark" x="55.5" y="28">&#10003;</text>

  <!-- Trashcan: lid at y 32-48, body at y 48-92, lid hinges at (46, 44). -->
  <g class="trash">
    <path d="M 27,44 v -2.5 a 1.5,1.5 0 0 1 1.5,-1.5 h 5 a 1.5,1.5 0 0 1 1.5,1.5 v 2.5" />
    <path d="M 16.5,44.5 H 45.5" />
    <path d="M 19,49 L 20.8,74.2 a 3,3 0 0 0 3,2.8 h 14.4 a 3,3 0 0 0 3,-2.8 L 43,49" />
    <path d="M 27.5,54 v 17 M 34.5,54 v 17" />
  </g>

  <!-- Zoom controls, 32x32 cells at y 92: reset, zoom in (top of pair), zoom out (bottom). -->
  <rect class="button" x="0.5" y="92.5" width="31" height="31" rx="6" ry="6" />
  <path class="button" d="M 32.5,123.5 V 98.5 a 6,6 0 0 1 6,-6 H 57.5 a 6,6 0 0 1 6,6 V 123.5 Z" />
  <path class="button" d="M 64.5,92.5 H 95.5 V 117.5 a 6,6 0 0 1 -6,6 H 70.5 a 6,6 0 0 1 -6,-6 Z" />

  <g class="icon">
    <path d="M 9,105 V 101 H 13 M 19,101 H 23 V 105 M 23,111 V 115 H 19 M 13,115 H 9 V 111" />
    <path d="M 48,102 v 12 M 42,108 h 12" />
